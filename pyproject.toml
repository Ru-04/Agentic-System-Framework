[project]
name = "webdesk-requirement-platform"
version = "0.3.10.0"
description = "WebDesk Agentic Requirement Analysis Platform - Gate 1 Foundation (Increment 1)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.4",
    "uvicorn==0.32.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "sqlalchemy==2.0.36",
    "alembic==1.13.3",
    "psycopg[binary]==3.2.3",
    "argon2-cffi==23.1.0",
    "cryptography==43.0.3",
    "pypdf==5.1.0",
    "python-docx==1.1.2",
    "rfc8785==0.1.4",
    "python-multipart==0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "httpx==0.27.2",
    "ruff==0.6.9",
    "mypy==1.11.2",
]

[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webdesk"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert, and literal passwords and tokens that are fixtures, never real credentials.
"tests/**" = ["S101", "S105", "S106"]
# Migrations contain DDL only. Their SQL is constant text, never built from input.
"migrations/**" = ["S608", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/webdesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a running PostgreSQL (WEBDESK_TEST_DATABASE_URL)",
    "hardening: negative tests run as the restricted webdesk_app_login role (WEBDESK_HARDENING_APP_URL)",
]
